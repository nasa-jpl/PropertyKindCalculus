# The ladder's assurance case (face.lean's tool shape, read by engineering-foundation-architecture's hcp-gate): the PhysLib contributor ladder
# L0 ⊂ … ⊂ L6 refines PKC, which refines the Foundation's root vocabulary, and every quantity term is bound
# to a kind of the catalogue — carried by sbvr-check's verdict on HCP/sbvr/physlib-contributor.yaml. An
# EVIDENCE node's `prov` is the PROV IRI of the verdict it is: the `check` activity, exit 0, in
# prov/physlib-contributor.nq; the activity used the chain at its content hash (the file, foundation.yaml
# and kinds.yaml), so when any of them changes the record changes and scripts/hcp-assurance.sh fails until
# it is regenerated (--fix). Concept: engineering-foundation-architecture docs/architecture/hcp-assurance.md.
nodes:
