  - {id: E2, kind: EVIDENCE, title: "hcp-gate (engineering-foundation-architecture, Lean): the record regenerates byte-identically in process from the chain on disk with the SBVR.lean kernel the gate is built with, the manifest's tool versions, and is PROV-valid under prov.lean's constraints — the gate activity in prov/gate.nq, which used the record and the case at their content hashes", prov: "urn:pkc:gate/hcp-gate", low: 1, high: 1}
edges:
  - {source: E1, target: S0, is_attack: false}
  - {source: S0, target: C0, is_attack: false}
