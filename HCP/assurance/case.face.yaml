  - {id: S0, kind: STRATEGY, title: "By sbvr-check's verdict on the chain, with its provenance"}
  - {id: E1, kind: EVIDENCE, title: "sbvr-check HCP/sbvr/physlib-contributor.yaml: PKC refines Foundation, L0 refines PKC and PhysLibKinds, L1…L6 each refines the one before, quantities bound to PhysLibKinds", prov: "urn:sbvr:check/pkc-physlib-contributor", low: 1, high: 1}
