  - {id: combines, kind: verb, roles: [fold, decomposition]}
  - {id: isReadIn, kind: verb, roles: [frameReading, frame]}
  - {id: combinesKind, kind: verb, roles: [unionLaw, kindOfProperty]}
  # L4 — out of the line
  - {id: spaceKind, kind: general}
  - {id: spaceReading, kind: general}
