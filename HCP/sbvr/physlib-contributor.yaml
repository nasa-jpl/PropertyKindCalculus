      - {concept: scaleType, text: "it is necessary that each kind of property is measured on exactly one scale type", source: "HCP L5 — KindOfProperty (id, scale)"}
      - {concept: ratioScale, text: "it is necessary that each ratio scale permits at least 1 quotient law", source: "HCP L5 — ScaleType.ratio: the scale type that licenses × and ÷"}
      - {concept: quotientLaw, text: "it is necessary that each quotient law is permitted by exactly one ratio scale", source: "HCP L5 — KindDiv, QuotientKind.ofRatio: a curated quotient law, δ = γ/(2m)"}
      - {concept: gatedSum, text: "it is necessary that each gated sum adds at least 1 quantity", source: "HCP L5 — Quantity.add: kind- and scale-gated addition"}
      - {concept: bearerErasure, text: "it is necessary that each bearer erasure forgets exactly one individual quantity", source: "HCP L5 — IndividualQuantity.toQuantity: forget the bearer"}
      - {concept: damper, text: "it is necessary that each damper is a component of exactly one whole", source: "HCP L5 — Losing energy: add a damper"}
