  - {id: bearerErasure, kind: general}
  - {id: damper, kind: general}
  - {id: hasScale, kind: verb, roles: [kindOfProperty, scaleType]}
  - {id: licensesQuotient, kind: verb, roles: [ratioScale, quotientLaw]}
  - {id: adds, kind: verb, roles: [gatedSum, quantity]}
  - {id: forgets, kind: verb, roles: [bearerErasure, individualQuantity]}
  # L6 — what must hold
  - {id: contract, kind: general}
  - {id: port, kind: general}
  - {id: member, kind: general}
  - {id: outputPort, kind: general}
  - {id: contractRequirement, kind: general}   # a Foundation requirement that governs a contract's port
  - {id: provableRequirement, kind: general}
  - {id: empiricalRequirement, kind: general}
  - {id: proof, kind: general}
  - {id: gate, kind: general}
  - {id: cleanlinessGate, kind: general}
  - {id: scope, kind: general}
  - {id: referent, kind: general}
  - {id: counterexample, kind: general}
  - {id: declaresPort, kind: verb, roles: [contract, port]}
  - {id: declaresMember, kind: verb, roles: [contract, member]}
  - {id: governs, kind: verb, roles: [contractRequirement, port]}
  - {id: discharges, kind: verb, roles: [proof, provableRequirement]}
  - {id: decides, kind: verb, roles: [gate, empiricalRequirement]}
  - {id: quantifiesOver, kind: verb, roles: [contractRequirement, scope]}
  - {id: hasReferent, kind: verb, roles: [empiricalRequirement, referent]}
  - {id: refutes, kind: verb, roles: [counterexample, contractRequirement]}
generalizes:
  # an object (Lowe's particular, the bearer) is a system in the Foundation's sense
  - {category: object, general: system}
  - {category: dimensionedKind, general: kindOfProperty}
  - {category: oscillatorMass, general: quantity}
  - {category: oscillatorStiffness, general: quantity}
  - {category: individualQuantity, general: quantity}
  - {category: sameBearerArithmetic, general: individualQuantity}
  - {category: pair, general: composite}
  - {category: extensiveKind, general: kindOfProperty}
  - {category: dedicatedKind, general: kindOfProperty}
  - {category: weightedCarving, general: decomposition}
  - {category: frameIndexedQuantity, general: individualQuantity}
  - {category: frameIndexedQuantity, general: frameReading}
  - {category: massUnionLaw, general: unionLaw}
  - {category: centerOfMassUnionLaw, general: unionLaw}
  - {category: inertiaUnionLaw, general: unionLaw}
  - {category: labAngularVelocity, general: frameIndexedQuantity}
  - {category: bodyAngularVelocity, general: frameIndexedQuantity}
  - {category: bodyInertia, general: frameIndexedQuantity}
  - {category: rotationalContraction, general: frameIndexedQuantity}
  - {category: spaceKind, general: kindOfProperty}
  - {category: spaceReading, general: quantity}
  - {category: positionReading, general: spaceReading}
  - {category: displacementReading, general: spaceReading}
  - {category: distanceReading, general: spaceReading}
  - {category: lengthReading, general: spaceReading}
  - {category: geometricTransport, general: frameConversion}
  - {category: boostTransport, general: frameConversion}
  - {category: frameVector, general: frameReading}
  - {category: frameVector, general: quantity}
  - {category: ratioScale, general: scaleType}
  - {category: damper, general: component}
  - {category: outputPort, general: port}
  - {category: contractRequirement, general: requirement}
  - {category: provableRequirement, general: contractRequirement}
  - {category: empiricalRequirement, general: contractRequirement}
  - {category: cleanlinessGate, general: gate}
  # a gate is a check and a contract an artifact in the Foundation's sense: `examines` is the Foundation's verb
  - {category: gate, general: check}
  - {category: contract, general: artifact}
catalogues:
  - {name: PhysLibKinds, kinds: kinds.yaml}
vocabularies:
  - name: PKC
    namespace: pkc
    includes: [Foundation]
    designations:
      - {signifier: system context, concept: systemContext}
      - {signifier: sort of system, concept: sortOfSystem}
      - {signifier: kind of property, concept: kindOfProperty}
      - {signifier: dimension, concept: dimension}
      - {signifier: object, concept: object}
    wordings:
      - {verb: namesSort, template: [{role: systemContext}, {text: " spans "}, {role: sortOfSystem}]}
      - {verb: hasSort, template: [{role: object}, {text: " instantiates "}, {role: sortOfSystem}]}
      - {verb: hasSort, template: [{role: sortOfSystem}, {text: " is the sort of "}, {role: object}]}
      - {verb: hasDimension, template: [{role: kindOfProperty}, {text: " carries "}, {role: dimension}]}
      - {verb: hasDimension, template: [{role: dimension}, {text: " is carried by "}, {role: kindOfProperty}]}
    definitions:
      - {concept: systemContext, text: "it is necessary that each system context spans at least 1 sort of system", source: "HCP/README.md — Jargon: system context"}
      - {concept: sortOfSystem, text: "it is possible that each sort of system is the sort of at least 1 object", source: "HCP/README.md — Jargon: sort of system, the universal category of a system's substantial bearer"}
      - {concept: kindOfProperty, text: "it is necessary that each kind of property carries at most 1 dimension", source: "HCP/README.md — Jargon: kind of property, distinct from its dimension"}
      - {concept: dimension, text: "it is possible that each dimension is carried by at least 1 kind of property", source: "HCP/README.md — Jargon: dimension-only metrology"}
      - {concept: object, text: "it is necessary that each object instantiates exactly one sort of system", source: "HCP/README.md — Lowe's square: a particular of a universal sort"}
  - name: L0
    includes: [PKC, PhysLibKinds]
    designations:
      - {signifier: quantity, concept: quantity}
      - {signifier: Quantity, concept: quantity, preferred: false}
      - {signifier: dimensioned kind, concept: dimensionedKind}
      - {signifier: DimensionedKind, concept: dimensionedKind, preferred: false}
      - {signifier: oscillator, concept: oscillator}
      - {signifier: black box, concept: oscillator, preferred: false}
      - {signifier: body, concept: body}
      - {signifier: spring, concept: spring}
      - {signifier: wall, concept: wall}
      - {signifier: oscillator mass, concept: oscillatorMass}
      - {signifier: massQ, concept: oscillatorMass, preferred: false}
      - {signifier: oscillator stiffness, concept: oscillatorStiffness}
      - {signifier: springQ, concept: oscillatorStiffness, preferred: false}
      - {signifier: mass, concept: mass}
      - {signifier: spring constant, concept: spring constant}
      - {signifier: stiffness, concept: spring constant, preferred: false}
      - {signifier: angular frequency, concept: angular frequency}
      - {signifier: angularFrequency, concept: angular frequency, preferred: false}
      - {signifier: angularFrequencyDK, concept: angular frequency, preferred: false}
      - {signifier: frequency, concept: frequency}
    wordings:
      - {verb: hasKind, template: [{role: quantity}, {text: " is of "}, {role: kindOfProperty}]}
      - {verb: isReadFrom, template: [{role: quantity}, {text: " is read from "}, {role: oscillator}]}
      - {verb: hasBody, template: [{role: oscillator}, {text: " consists of "}, {role: body}]}
      - {verb: hasBody, template: [{role: body}, {text: " is the body of "}, {role: oscillator}]}
      - {verb: connects, template: [{role: spring}, {text: " connects "}, {role: body}]}
      - {verb: isAnchoredTo, template: [{role: spring}, {text: " is anchored to "}, {role: wall}]}
      - {verb: isAnchoredTo, template: [{role: wall}, {text: " anchors "}, {role: spring}]}
    definitions:
      - {concept: quantity, text: "it is necessary that each quantity is of exactly one kind of property", source: "HCP L0 — Quantity: a magnitude of one fixed kind of property, with no bearer yet; massQ, springQ read PhysLib's oscillator mass and spring constant as kinded quantities"}
      - {concept: dimensionedKind, text: "it is necessary that each dimensioned kind carries exactly one dimension", source: "HCP L0 — angularFrequencyDK (.kind, .dim)"}
      - {concept: oscillatorMass, text: "it is necessary that each oscillator mass is read from exactly one oscillator", source: "HCP L0 — massQ reads PhysLib's oscillator mass as a kinded quantity"}
      - {concept: oscillatorStiffness, text: "it is necessary that each oscillator stiffness is read from exactly one oscillator", source: "HCP L0 — springQ reads PhysLib's oscillator spring constant as a kinded quantity"}
      - {concept: oscillator, text: "it is necessary that each oscillator consists of exactly one body", source: "HCP L0 — The black box: one body on one ideal spring to a wall"}
      - {concept: body, text: "it is necessary that each body is the body of exactly one oscillator", source: "HCP L0 — The black box"}
      - {concept: spring, text: "it is necessary that each spring is anchored to exactly one wall", source: "HCP L0 — The black box"}
      - {concept: wall, text: "it is necessary that each wall anchors at least 1 spring", source: "HCP L0 — The black box"}
    adopted:
      - {concept: mass, source: PhysLibKinds, reference: mass}
      - {concept: spring constant, source: PhysLibKinds, reference: spring constant}
      - {concept: angular frequency, source: PhysLibKinds, reference: angular frequency}
      - {concept: frequency, source: PhysLibKinds, reference: frequency}
  - name: L1
    includes: [L0]
    designations:
      - {signifier: bearer, concept: bearer}
      - {signifier: nominal name, concept: nominalName}
      - {signifier: designation, concept: nominalName, preferred: false}
      - {signifier: individual quantity, concept: individualQuantity}
      - {signifier: IndividualQuantity, concept: individualQuantity, preferred: false}
      - {signifier: same-bearer arithmetic, concept: sameBearerArithmetic}
      - {signifier: difference law, concept: differenceLaw}
      - {signifier: squared angular frequency, concept: squared angular frequency}
      - {signifier: angular frequency squared, concept: squared angular frequency, preferred: false}
      - {signifier: omegaSquaredK, concept: squared angular frequency, preferred: false}
      - {signifier: SortOfSystem, concept: sortOfSystem, preferred: false}
      - {signifier: Sorted, concept: object, preferred: false}
      - {signifier: Designated, concept: object, preferred: false}
      - {signifier: massK, concept: mass, preferred: false}
      - {signifier: springConstantK, concept: spring constant, preferred: false}
    wordings:
      - {verb: hasName, template: [{role: object}, {text: " is named by "}, {role: nominalName}]}
      - {verb: hasName, template: [{role: nominalName}, {text: " names "}, {role: object}]}
      - {verb: isAbout, template: [{role: individualQuantity}, {text: " is about "}, {role: bearer}]}
      - {verb: isAbout, template: [{role: bearer}, {text: " bears "}, {role: individualQuantity}]}
      - {verb: compares, template: [{role: differenceLaw}, {text: " compares "}, {role: kindOfProperty}]}
    definitions:
      - {concept: bearer, text: "it is necessary that each bearer bears at least 1 individual quantity", source: "HCP L1 — Jargon: bearer, the object a property is about; L1 indexes by the whole oscillator. Sorted (sortOf): an object type whose objects know their sort"}
      - {concept: nominalName, text: "it is necessary that each nominal name names exactly one object", source: "HCP L1 — Designated (designation, designation_inj): distinct nominal names"}
      - {concept: individualQuantity, text: "it is necessary that each individual quantity is about exactly one bearer", source: "HCP L1 — IndividualQuantity: a magnitude of kind k about one object o"}
      - {concept: sameBearerArithmetic, text: "it is necessary that each same-bearer arithmetic is about exactly one bearer", source: "HCP L1 — IndividualQuantity.add, IndividualQuantity.div: same-object, kind-licensed arithmetic"}
      - {concept: differenceLaw, text: "it is necessary that each difference law compares exactly one kind of property", source: "HCP L1 — DifferenceKind.ofScale: licenses comparing two records of one quantity"}
    adopted:
      - {concept: sortOfSystem, source: PKC, reference: sortOfSystem}
      - {concept: object, source: PKC, reference: object}
      - {concept: squared angular frequency, source: PhysLibKinds, reference: squared angular frequency}
  - name: L2
    includes: [L1]
    designations:
      - {signifier: composite, concept: composite}
      - {signifier: Composite, concept: composite, preferred: false}
      - {signifier: whole, concept: whole}
      - {signifier: part, concept: part}
      - {signifier: decomposition, concept: decomposition}
      - {signifier: Decomposition, concept: decomposition, preferred: false}
      - {signifier: aggregation licence, concept: aggregationLicence}
      - {signifier: Assembles, concept: aggregationLicence, preferred: false}
      - {signifier: assembly, concept: assembly}
      - {signifier: assemble, concept: assembly, preferred: false}
      - {signifier: extensive kind, concept: extensiveKind}
      - {signifier: Extensive, concept: extensiveKind, preferred: false}
      - {signifier: dedicated kind, concept: dedicatedKind}
      - {signifier: DedicatedKind, concept: dedicatedKind, preferred: false}
      - {signifier: component, concept: component}
      - {signifier: Component, concept: component, preferred: false}
      - {signifier: pair, concept: pair}
      - {signifier: coupled pair, concept: pair, preferred: false}
      - {signifier: displacement, concept: displacement}
      - {signifier: spring extension, concept: displacement, preferred: false}
      - {signifier: displacementK, concept: displacement, preferred: false}
    wordings:
      - {verb: hasWhole, template: [{role: composite}, {text: " is seen as "}, {role: whole}]}
      - {verb: hasPart, template: [{role: whole}, {text: " comprises "}, {role: part}]}
      - {verb: hasPart, template: [{role: part}, {text: " is a part of "}, {role: whole}]}
      - {verb: carves, template: [{role: decomposition}, {text: " carves "}, {role: whole}]}
      - {verb: licenses, template: [{role: aggregationLicence}, {text: " licenses "}, {role: kindOfProperty}]}
      - {verb: licenses, template: [{role: kindOfProperty}, {text: " is licensed by "}, {role: aggregationLicence}]}
      - {verb: folds, template: [{role: assembly}, {text: " folds "}, {role: decomposition}]}
      - {verb: isDedicatedTo, template: [{role: dedicatedKind}, {text: " is dedicated to "}, {role: sortOfSystem}]}
      - {verb: isComponentOf, template: [{role: component}, {text: " is a component of "}, {role: whole}]}
      - {verb: couples, template: [{role: pair}, {text: " couples "}, {role: body}]}
    definitions:
      - {concept: composite, text: "it is necessary that each composite is seen as exactly one whole", source: "HCP L2 — Composite (whole, part): the object type of a whole and its parts"}
      - {concept: whole, text: "it is necessary that each whole comprises at least 1 part", source: "HCP L2 — Composite"}
      - {concept: part, text: "it is necessary that each part is a part of exactly one whole", source: "HCP L2 — Composite"}
      - {concept: decomposition, text: "it is necessary that each decomposition carves exactly one whole", source: "HCP L2 — Decomposition (atom, union): how a whole is carved into parts"}
      - {concept: aggregationLicence, text: "it is necessary that each aggregation licence licenses exactly one kind of property", source: "HCP L2 — Assembles: the aggregation licence, keyed by the sort of the whole and the kind"}
      - {concept: assembly, text: "it is necessary that each assembly folds exactly one decomposition", source: "HCP L2 — assemble: fold a licensed quantity over a decomposition"}
      - {concept: extensiveKind, text: "it is obligatory that each extensive kind is licensed by at least 1 aggregation licence", source: "HCP L2 — Extensive: a kind whose value over a union is the sum over its parts"}
      - {concept: dedicatedKind, text: "it is necessary that each dedicated kind is dedicated to exactly one sort of system", source: "HCP L2 — DedicatedKind, KindOfProperty.dedicatedTo: the pair's normal-mode frequency"}
      - {concept: component, text: "it is necessary that each component is a component of exactly one whole", source: "HCP L2 — Component: a named component of a system's characterization"}
      - {concept: pair, text: "it is necessary that each pair couples at least 1 body", source: "HCP L2 — The pair is a system too"}
    adopted:
      - {concept: displacement, source: PhysLibKinds, reference: displacement}
  - name: L3
    includes: [L2]
    designations:
      - {signifier: weighted carving, concept: weightedCarving}
      - {signifier: WeightedCarving, concept: weightedCarving, preferred: false}
      - {signifier: total weight, concept: totalWeight}
      - {signifier: totalWeight, concept: totalWeight, preferred: false}
      - {signifier: weighted sum, concept: weightedSum}
      - {signifier: weightedSum, concept: weightedSum, preferred: false}
      - {signifier: weighted mean, concept: weightedMean}
      - {signifier: fold, concept: fold}
      - {signifier: frame, concept: frame}
      - {signifier: frame reading, concept: frameReading}
      - {signifier: InFrame, concept: frameReading, preferred: false}
      - {signifier: union law, concept: unionLaw}
      - {signifier: mass union law, concept: massUnionLaw}
      - {signifier: union_mass, concept: massUnionLaw, preferred: false}
      - {signifier: centre-of-mass union law, concept: centerOfMassUnionLaw}
      - {signifier: union_centerOfMass, concept: centerOfMassUnionLaw, preferred: false}
      - {signifier: inertia union law, concept: inertiaUnionLaw}
      - {signifier: union_inertiaTensor, concept: inertiaUnionLaw, preferred: false}
      - {signifier: frame-indexed quantity, concept: frameIndexedQuantity}
      - {signifier: lab angular velocity, concept: labAngularVelocity}
      - {signifier: labOmega, concept: labAngularVelocity, preferred: false}
      - {signifier: body angular velocity, concept: bodyAngularVelocity}
      - {signifier: bodyOmega, concept: bodyAngularVelocity, preferred: false}
      - {signifier: body inertia, concept: bodyInertia}
      - {signifier: bodyInertia, concept: bodyInertia, preferred: false}
      - {signifier: rotational contraction, concept: rotationalContraction}
      - {signifier: rotationalContraction, concept: rotationalContraction, preferred: false}
    wordings:
      - {verb: hasTotalWeight, template: [{role: weightedCarving}, {text: " totals "}, {role: totalWeight}]}
      - {verb: hasTotalWeight, template: [{role: totalWeight}, {text: " is the total weight of "}, {role: weightedCarving}]}
      - {verb: hasWeightedSum, template: [{role: weightedSum}, {text: " is the weighted sum of "}, {role: weightedCarving}]}
      - {verb: hasWeightedMean, template: [{role: weightedMean}, {text: " is the weighted mean of "}, {role: weightedCarving}]}
      - {verb: combines, template: [{role: fold}, {text: " combines "}, {role: decomposition}]}
      - {verb: isReadIn, template: [{role: frameReading}, {text: " is read in "}, {role: frame}]}
      - {verb: isReadIn, template: [{role: frame}, {text: " is the frame of "}, {role: frameReading}]}
      - {verb: combinesKind, template: [{role: unionLaw}, {text: " aggregates "}, {role: kindOfProperty}]}
    definitions:
      - {concept: weightedCarving, text: "it is necessary that each weighted carving totals exactly one total weight", source: "HCP L3 — WeightedCarving (parts, weight, mean, total_ne_zero)"}
      - {concept: totalWeight, text: "it is necessary that each total weight is the total weight of exactly one weighted carving", source: "HCP L3 — totalWeight: a piece of the weighted mean; nonzero"}
      - {concept: weightedSum, text: "it is necessary that each weighted sum is the weighted sum of exactly one weighted carving", source: "HCP L3 — weightedSum"}
      - {concept: weightedMean, text: "it is necessary that each weighted mean is the weighted mean of exactly one weighted carving", source: "HCP L3 — WeightedCarving.mean requires nonzero total weight"}
      - {concept: fold, text: "it is necessary that each fold combines exactly one decomposition", source: "HCP L3 — Decomposition.fold: a value per part, combined over a decomposition"}
      - {concept: frame, text: "it is possible that each frame is the frame of at least 1 frame reading", source: "HCP L3 — InFrame: components read in a stated frame"}
      - {concept: frameReading, text: "it is necessary that each frame reading is read in exactly one frame", source: "HCP L3 — InFrame"}
      - {concept: unionLaw, text: "it is necessary that each union law aggregates exactly one kind of property", source: "HCP L3 — ForPhysLib.Exhibits.Composition.Findings: one law per kind"}
      - {concept: massUnionLaw, text: "it is necessary that each mass union law aggregates exactly one kind of property", source: "theorem union_mass — the mass of a union is the sum of the masses"}
      - {concept: centerOfMassUnionLaw, text: "it is necessary that each centre-of-mass union law aggregates exactly one kind of property", source: "theorem union_centerOfMass — the mass-weighted mean of the centres, under nonzero total mass"}
      - {concept: inertiaUnionLaw, text: "it is necessary that each inertia union law aggregates exactly one kind of property", source: "theorem union_inertiaTensor — the inertia tensor of a union is the sum of the tensors"}
      - {concept: frameIndexedQuantity, text: "it is necessary that each frame-indexed quantity is read in exactly one frame", source: "HCP L3 — ForPhysLib.Exhibits.RigidBody.Findings: rigid-body quantities indexed by frame"}
      - {concept: labAngularVelocity, text: "it is necessary that each lab angular velocity is read in exactly one frame", source: "def labOmega — the angular velocity in the lab frame"}
      - {concept: bodyAngularVelocity, text: "it is necessary that each body angular velocity is read in exactly one frame", source: "def bodyOmega — the angular velocity in the body frame"}
      - {concept: bodyInertia, text: "it is necessary that each body inertia is read in exactly one frame", source: "def bodyInertia — the inertia tensor in the body frame"}
      - {concept: rotationalContraction, text: "it is necessary that each rotational contraction is read in exactly one frame", source: "def rotationalContraction — ω · (I ω) in one frame, over any dimension and kinds"}
