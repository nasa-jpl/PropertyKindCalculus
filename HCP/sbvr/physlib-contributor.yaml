      - {concept: spaceKind, text: "it is necessary that each space kind carries exactly one dimension", source: "HCP L4 — positionVector, displacement, distance, area: ISO 80000-3 space kinds"}
      - {concept: spaceReading, text: "it is necessary that each space reading is read at exactly one space kind", source: "HCP L4 — ForPhysLib.Kinded.Space: PhysLib Space values read at their kinds"}
      - {concept: positionReading, text: "it is necessary that each position reading is read at exactly one space kind", source: "def positionQ — a point read as a position vector"}
      - {concept: displacementReading, text: "it is necessary that each displacement reading is read at exactly one space kind", source: "def displacementQ — two points read as a displacement"}
      - {concept: distanceReading, text: "it is necessary that each distance reading is read at exactly one space kind", source: "def distanceQ — two points read as a distance"}
      - {concept: lengthReading, text: "it is necessary that each length reading is read at exactly one space kind", source: "def lengthOf — the length of a displacement"}
      - {concept: frameVector, text: "it is necessary that each frame vector states exactly one kind of property", source: "HCP L4 — KVector: a frame vector with its physical kind stated"}
      - {concept: frameConversion, text: "it is necessary that each frame conversion is typed for exactly one kind of property", source: "HCP L4 — each conversion typed for one kind of vector"}
      - {concept: geometricTransport, text: "it is necessary that each geometric transport is typed for exactly one kind of property", source: "def kGeometricTransport — the geometric transport law, naming the kind of vector it is the law for"}
      - {concept: boostTransport, text: "it is necessary that each boost transport is typed for exactly one kind of property", source: "def kBoostTransport — the boost law, only for velocities; the boost itself arrives kinded"}
