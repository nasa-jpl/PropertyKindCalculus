  - {id: positionReading, kind: general}
  - {id: displacementReading, kind: general}
  - {id: distanceReading, kind: general}
  - {id: lengthReading, kind: general}
  - {id: geometricTransport, kind: general}
  - {id: boostTransport, kind: general}
