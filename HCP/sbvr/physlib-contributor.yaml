# The PhysLib contributor's ladder (HCP/L0 … L6) as an SBVR chain — SBVR.lean docs/HCP.md, delivery
# step 2. One vocabulary per lesson; each includes the lesson before it, so a lesson's "PKC
# vocabulary in scope — carried from earlier steps" is the inclusion closure and is not restated.
# A term the lesson lists as new but that an earlier lesson (or the repository's foundation
# vocabulary `PKC`) already defines is recorded as an *adoption* of that definition, so that
# `sbvr-check` reports drift if the lesson ever words it differently.
#
# Three kinds of terms:
#   * quantity terms — one per `KindOfProperty` the lesson reads, adopted from the catalogue
#     `PhysLibKinds` (HCP/sbvr/kinds.yaml, generated from the Lean kinds in scope; never edited);
#   * the lesson's PKC notions (Quantity, IndividualQuantity, Composite, …) — the English term is
#     preferred, the dot-free Lean name a synonym, dotted names in the definition's `source`;
#   * the lesson's system context (oscillator, body, spring, wall, pair, damper, frame, …).
# Every definition is SBVR Structured English read against the vocabulary in scope; the lesson it
# comes from is its `source`. `sbvr-check render physlib-contributor.yaml Lk` writes lesson k's
# "Vocabulary in scope" (HCP/sbvr/rendered/Lk.md); check-hcp.py --sbvr keeps those renderings and
# the catalogue in step with this file.
#
# `PKC ⊂ Foundation`: the root vocabulary of engineering-foundation-architecture (docs/hcp/foundation.yaml,
# vendored at a pinned commit as HCP/sbvr/foundation.yaml — scripts/foundation-vocabulary.sh keeps it
# current) is imported, PKC includes and refines it, and an object — the substantial bearer a sort of
# system is the universal of — is a system in the Foundation's sense.
#
# Not here yet: the lessons' Verifiable properties and Errors prevented as rules with evidence
# (SBVR.lean has no rule schema in the chain file yet) — a follow-up named in HCP/README.md.
imports:
  - {file: foundation.yaml, vocabularies: [Foundation]}
