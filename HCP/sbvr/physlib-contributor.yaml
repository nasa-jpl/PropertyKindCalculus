      - {verb: decides, template: [{role: gate}, {text: " decides "}, {role: empiricalRequirement}]}
      - {verb: decides, template: [{role: empiricalRequirement}, {text: " is decided by "}, {role: gate}]}
      - {verb: quantifiesOver, template: [{role: contractRequirement}, {text: " quantifies over "}, {role: scope}]}
