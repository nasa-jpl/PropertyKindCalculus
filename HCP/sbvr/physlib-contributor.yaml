  - {id: totalWeight, kind: general}
  - {id: weightedSum, kind: general}
  - {id: weightedMean, kind: general}
  - {id: fold, kind: general}
  - {id: frame, kind: general}
  - {id: frameReading, kind: general}
  - {id: unionLaw, kind: general}
  - {id: frameIndexedQuantity, kind: general}
  - {id: massUnionLaw, kind: general}
  - {id: centerOfMassUnionLaw, kind: general}
  - {id: inertiaUnionLaw, kind: general}
