      - {verb: refutes, template: [{role: counterexample}, {text: " refutes "}, {role: contractRequirement}]}
    definitions:
      - {concept: contract, text: "it is necessary that each contract declares at least 1 port", source: "HCP L6 — Provenance.Contract: a declared model boundary with its members and ports"}
      - {concept: port, text: "it is necessary that each port is a port of exactly one contract", source: "HCP L6 — Provenance.Contract"}
      - {concept: member, text: "it is necessary that each member is a member of exactly one contract", source: "HCP L6 — Provenance.Contract"}
      - {concept: outputPort, text: "it is obligatory that each output port is governed by at least 1 contract requirement", source: "HCP L6 — NodeId.result, PortDir.output; #kind_requirement_clean fails on an ungoverned output"}
      - {concept: contractRequirement, text: "it is necessary that each contract requirement governs exactly one port", source: "HCP L6 — Provenance.Requirement (statement, governs, port, scope, witness, absent, gate, referents, spotChecks)"}
      - {concept: provableRequirement, text: "it is necessary that each provable requirement is discharged by exactly one proof", source: "HCP L6 — RequirementKind.provable: discharged by a proof"}
      - {concept: empiricalRequirement, text: "it is necessary that each empirical requirement is decided by exactly one gate", source: "HCP L6 — RequirementKind.empirical: decided by a gate"}
      - {concept: proof, text: "it is necessary that each proof discharges at least 1 provable requirement", source: "HCP L6 — RequirementKind.provable"}
      - {concept: gate, text: "it is necessary that each gate decides at least 1 empirical requirement", source: "HCP L6 — RequirementKind.empirical"}
      - {concept: cleanlinessGate, text: "it is necessary that each cleanliness gate examines exactly one contract", source: "HCP L6 — #kind_requirement_clean: the gate that fails on any ungoverned or unchecked output"}
      - {concept: scope, text: "it is necessary that each scope is the scope of at least 1 contract requirement", source: "HCP L6 — RequirementScope.sort, RequirementScope.objects: what a requirement quantifies over"}
      - {concept: referent, text: "it is necessary that each referent is a referent of exactly one empirical requirement", source: "HCP L6 — @[kindReferent]: an empirical referent"}
      - {concept: counterexample, text: "it is necessary that each counterexample refutes exactly one contract requirement", source: "HCP L6 — @[kindCounterexample]: a refuting witness"}
