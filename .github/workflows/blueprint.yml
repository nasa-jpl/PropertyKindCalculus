name: Build and Publish Design Blueprint

# Self-hosted CI for PropertyKindCalculus, modelled on L4YAML's
# `.github/workflows/test-coverage.yml` but reduced to the blueprint spine:
# build the Mathlib-free Lean core + examples, then the Mathlib/PhysLib/TorchLean-
# backed dimension and uncertainty layers plus the `Tests` validation suite (so all
# sixteen verifiable requirements are CI-enforced), build and render the Verso
# design blueprint (HTML + a paginated PDF), generate the doc-gen4 API site under
# docs/api/, and (on main) publish them to the orphan `gh-pages` branch — never
# committed on main. PropertyKindCalculus has no FFI / Rust stages, so those phases
# of the L4YAML job are omitted; its doc-gen4 stage is mirrored here (Phase 4b).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  blueprint:
    runs-on: self-hosted

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: |
          # Root and blueprint/ pin the same toolchain (leanprover/lean4:v4.32.0),
          # so installing the root one is sufficient for both Lake packages.
          if [ -f lean-toolchain ]; then
            TOOLCHAIN="$(cat lean-toolchain)"
            echo "Lean toolchain: $TOOLCHAIN"
            elan toolchain install "$TOOLCHAIN" || true
          fi
          elan show

      - name: Set up Python tooling via pixi
        run: |
          # The blueprint's Python steps (file-links post-pass + the WeasyPrint PDF
          # render) run on a pinned Python + WeasyPrint managed by pixi
          # (blueprint/pyproject.toml + pixi.lock), so the host's system python3 is
          # irrelevant. Install pixi if the runner lacks it, put it on PATH for the
          # later steps, and materialize the locked environment up front.
          if ! command -v pixi >/dev/null 2>&1 && [ ! -x "$HOME/.pixi/bin/pixi" ]; then
            curl -fsSL https://pixi.sh/install.sh | bash
          fi
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi install --manifest-path blueprint/pyproject.toml

      # -------------------------------------------------------
      # Phase 1a: Build the Lean spine (Mathlib-free core + examples)
      # -------------------------------------------------------
      - name: Build core library and examples
        run: |
          # The core spine is Mathlib-free, so this is the fastest signal that the
          # spine is sound — run first so a core break fails the job before the
          # heavier Mathlib-backed build below.
          lake build
          lake build Examples

      # -------------------------------------------------------
      # Phase 1b: Build the Mathlib/PhysLib/TorchLean-backed layers and the
      # validation-test suite that probes every verifiable requirement.
      # -------------------------------------------------------
      - name: Build the dimension/uncertainty layers and the validation suite
        run: |
          # Seven of the sixteen verifiable requirements are discharged in the
          # PhysLib/Mathlib-backed layers (R1/R5/R7/R13/R17-ℝ in `Dimension`;
          # R14/R15/R18 in `Uncertainty`/`UncertaintyRigor`). Before the `Tests`
          # library existed these theorems were never built by CI — a theorem CI
          # never compiles is validated by nobody. Building them here, plus the
          # `Tests` suite that pins each requirement theorem's axiom profile and
          # drives a concrete inhabitation witness through it, brings all sixteen
          # under regression.
          #
          # These layers need Mathlib oleans: fetch them from the Mathlib cache
          # rather than recompiling Mathlib from source. (PhysLib and TorchLean are
          # compiled from their pinned sources. The `Torch` library builds again
          # since the upstream TorchLean 4.32 module reorg was absorbed, and the
          # `Tests.Torch` tier probes its kind layer, so it is built here.)
          lake exe cache get
          lake build Dimension Uncertainty UncertaintyRigor Torch ForMathlib Graph
          lake build Tests

      # -------------------------------------------------------
      # Phase 2: Build + render the Verso design blueprint
      # (a separate Lake package under blueprint/ that pulls in Verso)
      # -------------------------------------------------------
      - name: Reuse the root package's dependency checkouts in blueprint/
        # blueprint/ is a separate Lake package, so without this Lake materializes the
        # WHOLE transitive git closure a second time under blueprint/.lake/packages —
        # its own Mathlib, Batteries, Physlib, TorchLean, doc-gen4… all re-fetched and
        # rebuilt, even though Phase 1 above has just built the identical revisions in
        # the root. The generator emits path overrides for every dependency the two
        # packages pin at the SAME rev (it reports, and refuses to wire up, any that
        # disagree); Lake reads blueprint/.lake/package-overrides.json automatically
        # during resolution, so the `lake build` below needs no extra flag.
        #
        # Must run AFTER Phase 1 — it points at the root's .lake/packages, which only
        # exist once the root has been resolved.
        run: scripts/gen-package-overrides.sh --target blueprint --exclude PropertyKindCalculus

      - name: Build and render the design blueprint
        run: |
          cd blueprint
          # `lake build` (not `lake update`) so the pinned, committed
          # blueprint/lake-manifest.json governs the Verso revisions — transitive
          # deps tracked on `main` cannot drift and break a reproducible render.
          # Missing packages are still fetched at their pinned revs on a fresh runner
          # — now only the verso stack, the rest being redirected by the step above.
          lake build
          # Render into a CLEAN output dir. `blueprint-gen` never prunes superseded,
          # content-hashed `searchIndex_N.<hash>.js` search shards, so on a persistent
          # self-hosted runner a reused `_out/blueprint` accumulates several stale shard
          # sets that stage-docs.sh would then copy into the published site. Wiping it
          # first guarantees a single, current shard set.
          rm -rf _out/blueprint
          # `--with-html-single` also emits a self-contained one-page build
          # (html-single/) alongside the multi-page site (html-multi/).
          lake exe blueprint-gen --output _out/blueprint --with-html-single
          # Spell out index.html in multi-page directory links so the site is
          # also navigable over file:// (a no-op when served over HTTP). Python runs
          # through the pinned pixi env (set up above), not the host python3.
          pixi run python scripts/file-links.py _out/blueprint/html-multi

      # -------------------------------------------------------
      # Phase 3: Render a paginated PDF of the single-page site
      # -------------------------------------------------------
      - name: Render blueprint PDF
        run: |
          cd blueprint
          # render-pdf.sh runs WeasyPrint through the pinned pixi env (Python +
          # WeasyPrint), the same way the local render (ci-pages.sh) does, and copies
          # the PDF into html-single/ and html-multi/ so stage-docs.sh publishes it
          # under docs/. The render is required (the PDF is a published artifact), so
          # it fails the job loudly rather than silently shipping HTML only.
          bash scripts/render-pdf.sh

      # -------------------------------------------------------
      # Phase 4: Publish the rendered HTML + PDF under docs/
      # -------------------------------------------------------
      - name: Stage blueprint HTML and PDF under docs/
        # Same script the local render (ci-pages.sh) calls, so the published
        # docs/ layout is defined in exactly one place. It copies html-multi/ and
        # html-single/ verbatim, carrying the PDF that Phase 3 placed inside them.
        run: bash blueprint/scripts/stage-docs.sh

      # -------------------------------------------------------
      # Phase 4b: Generate the doc-gen4 API site under docs/api/
      # -------------------------------------------------------
      - name: Build and stage doc-gen4 API documentation
        # MUST run AFTER the stage step above: stage-docs.sh does `rm -rf docs/` before copying the
        # blueprint in, so staging the API site first would delete it again.
        #
        # The script owns the scope (the Mathlib-free tier) and the docs/api/ layout, so CI and any
        # local render agree by construction. It also fails the job if a docs target reports
        # "0 root modules" — doc-gen4 renders `lib.rootModules`, and a library that declares only
        # `globs` has a non-existent default root, which Lake reports as a *successful* build that
        # generates nothing. See the NOTE in lakefile.lean.
        #
        # This is the first stage that *builds* doc-gen4 (~131 jobs: leansqlite, MD4Lean,
        # UnicodeBasic, BibtexQuery, Cli, DocGen4). It is still never imported by any module.
        run: bash scripts/build-api-docs.sh

      - name: Upload blueprint as artifact
        uses: actions/upload-artifact@v4
        with:
          name: propertykindcalculus-blueprint
          path: docs/
          retention-days: 30

      # -------------------------------------------------------
      # Phase 5: Publish the site to the orphan gh-pages branch
      # -------------------------------------------------------
      - name: Publish documentation to gh-pages branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        # publish-pages.sh commits docs/ as a single ORPHAN commit on gh-pages and
        # force-pushes it (PAGES_PUSH=1), so the regenerated site never touches main's
        # history. Pages: Settings -> Pages -> Deploy from a branch -> gh-pages -> / (root).
        run: PAGES_PUSH=1 bash scripts/publish-pages.sh
