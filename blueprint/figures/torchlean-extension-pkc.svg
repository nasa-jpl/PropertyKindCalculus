<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1007" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="What PropertyKindCalculus adds beyond TorchLean, layer by layer"><defs><marker id="ext-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E4002B"/></marker></defs><rect x="0" y="0" width="960" height="1007" fill="#FFFFFF"/><text x="331.0" y="34.0" font-size="14.0" fill="#000000" text-anchor="middle" font-weight="700">What TorchLean provides</text><text x="747.0" y="34.0" font-size="14.0" fill="#E4002B" text-anchor="middle" font-weight="700">What PropertyKindCalculus adds beyond TorchLean</text><text x="22.0" y="103.5" font-size="12.0" fill="#000000" font-weight="700">Meaning</text><rect x="150.0" y="52.0" width="362.0" height="95.0" rx="6.0" fill="none" stroke="#C8C8C8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="548.0" y="52.0" width="398.0" height="95.0" rx="6.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.4"/><line x1="518.0" y1="99.5" x2="544.0" y2="99.5" stroke="#E4002B" stroke-width="1.6" marker-end="url(#ext-arrow)"/><text x="22.0" y="201.0" font-size="12.0" fill="#000000" font-weight="700">Uncertainty</text><rect x="150.0" y="157.0" width="362.0" height="80.0" rx="6.0" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="548.0" y="157.0" width="398.0" height="80.0" rx="6.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.4"/><line x1="518.0" y1="197.0" x2="544.0" y2="197.0" stroke="#E4002B" stroke-width="1.6" marker-end="url(#ext-arrow)"/><text x="22.0" y="321.0" font-size="12.0" fill="#000000" font-weight="700">Performance</text><rect x="150.0" y="247.0" width="362.0" height="140.0" rx="6.0" fill="none" stroke="#C8C8C8" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="548.0" y="247.0" width="398.0" height="140.0" rx="6.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.4"/><line x1="518.0" y1="317.0" x2="544.0" y2="317.0" stroke="#E4002B" stroke-width="1.6" marker-end="url(#ext-arrow)"/><text x="22.0" y="441.0" font-size="12.0" fill="#000000" font-weight="700">Code generation</text><rect x="150.0" y="397.0" width="362.0" height="80.0" rx="6.0" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="548.0" y="397.0" width="398.0" height="80.0" rx="6.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.4"/><line x1="518.0" y1="437.0" x2="544.0" y2="437.0" stroke="#E4002B" stroke-width="1.6" marker-end="url(#ext-arrow)"/><text x="22.0" y="611.0" font-size="12.0" fill="#000000" font-weight="700">Kernel alphabet</text><rect x="150.0" y="487.0" width="362.0" height="240.0" rx="6.0" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="548.0" y="487.0" width="398.0" height="240.0" rx="6.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.4"/><line x1="518.0" y1="607.0" x2="544.0" y2="607.0" stroke="#E4002B" stroke-width="1.6" marker-end="url(#ext-arrow)"/><text x="22.0" y="781.0" font-size="12.0" fill="#000000" font-weight="700">Recording</text><rect x="150.0" y="737.0" width="362.0" height="80.0" rx="6.0" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="548.0" y="737.0" width="398.0" height="80.0" rx="6.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.4"/><line x1="518.0" y1="777.0" x2="544.0" y2="777.0" stroke="#E4002B" stroke-width="1.6" marker-end="url(#ext-arrow)"/><text x="22.0" y="871.0" font-size="12.0" fill="#000000" font-weight="700">Numbers</text><rect x="150.0" y="827.0" width="362.0" height="80.0" rx="6.0" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="548.0" y="827.0" width="398.0" height="80.0" rx="6.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.4"/><line x1="518.0" y1="867.0" x2="544.0" y2="867.0" stroke="#E4002B" stroke-width="1.6" marker-end="url(#ext-arrow)"/><text x="164.0" y="74.0" font-size="11.5" fill="#767676">no counterpart: a tensor holds numbers,</text><text x="164.0" y="89.0" font-size="11.5" fill="#767676">not quantities</text><text x="562.0" y="74.0" font-size="11.5" fill="#E4002B" font-weight="700">each quantity carries its kind; erasing it costs nothing</text><text x="562.0" y="89.0" font-size="11.5" fill="#E4002B">proved both ways (a weak bisimulation):</text><text x="562.0" y="104.0" font-size="11.5" fill="#E4002B">every model step appears in the compiled program, and</text><text x="562.0" y="119.0" font-size="11.5" fill="#E4002B">every program path traces back to the model, so it adds</text><text x="562.0" y="134.0" font-size="11.5" fill="#E4002B">no input, constant or change of kind the model lacks</text><text x="164.0" y="179.0" font-size="11.5" fill="#000000" font-weight="700">round-off error bounds</text><text x="164.0" y="194.0" font-size="11.5" fill="#000000">for floating-point evaluation</text><text x="562.0" y="179.0" font-size="11.5" fill="#E4002B" font-weight="700">measurement uncertainty: GUM ⊂ Willink ⊂ SSPRC</text><text x="562.0" y="194.0" font-size="11.5" fill="#E4002B">coverage intervals; conformity assessment (JCGM 106)</text><text x="562.0" y="209.0" font-size="11.5" fill="#E4002B">round-off charged to the uncertainty budget,</text><text x="562.0" y="224.0" font-size="11.5" fill="#E4002B">in TorchLean's binary32 rounding vocabulary</text><text x="164.0" y="269.0" font-size="11.5" fill="#767676">no counterpart: no intensity, memory or</text><text x="164.0" y="284.0" font-size="11.5" fill="#767676">platform-capacity accounting</text><text x="562.0" y="269.0" font-size="11.5" fill="#E4002B" font-weight="700">arithmetic intensity computed from the recorded model</text><text x="562.0" y="284.0" font-size="11.5" fill="#E4002B">eager vs fused gap reported; peak memory per strategy</text><text x="562.0" y="299.0" font-size="11.5" fill="#E4002B" font-weight="700">tuned partitioning of each image tile:</text><text x="562.0" y="314.0" font-size="11.5" fill="#E4002B">as many pieces as keep every core busy, as long as</text><text x="562.0" y="329.0" font-size="11.5" fill="#E4002B">memory holds them and each piece repays its startup</text><text x="562.0" y="344.0" font-size="11.5" fill="#E4002B" font-weight="700">fusion keeps intermediates in registers, not memory:</text><text x="562.0" y="359.0" font-size="11.5" fill="#E4002B" font-weight="700">the speedup, proved to compute the same values</text><text x="562.0" y="374.0" font-size="11.5" fill="#E4002B" font-weight="700">with the same meaning as the unfused model</text><text x="164.0" y="419.0" font-size="11.5" fill="#000000" font-weight="700">certified kernel compiler</text><text x="164.0" y="434.0" font-size="11.5" fill="#000000">a Lean scalar function becomes CUDA, proved</text><text x="164.0" y="449.0" font-size="11.5" fill="#000000">to compute what the function computes</text><text x="164.0" y="464.0" font-size="11.5" fill="#000000">one kernel per function; Julia only as a subprocess</text><text x="562.0" y="419.0" font-size="11.5" fill="#E4002B" font-weight="700">one fused kernel for a whole model</text><text x="562.0" y="434.0" font-size="11.5" fill="#E4002B">proved: the one program every target is printed from</text><text x="562.0" y="449.0" font-size="11.5" fill="#E4002B">computes what the model computes;</text><text x="562.0" y="464.0" font-size="11.5" fill="#E4002B">the CUDA, C and Julia printers and compilers are trusted</text><text x="164.0" y="509.0" font-size="11.5" fill="#000000" font-weight="700">what a certified binary32/64 kernel may use</text><rect x="164.0" y="524.0" width="22.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="175.4" y="538.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">+</text><rect x="193.8" y="524.0" width="22.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="205.2" y="538.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">−</text><rect x="223.6" y="524.0" width="22.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="235.0" y="538.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">×</text><rect x="253.4" y="524.0" width="22.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="264.8" y="538.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">÷</text><rect x="283.2" y="524.0" width="22.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="294.6" y="538.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">&lt;</text><rect x="313.0" y="524.0" width="29.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="327.8" y="538.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">if</text><rect x="164.0" y="554.0" width="124.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="226.4" y="568.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">⌊u⌋ as index #44</text><rect x="295.8" y="554.0" width="111.2" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="351.4" y="568.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">f64 on f32 #47</text><rect x="164.0" y="584.0" width="90.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="209.4" y="598.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">else if #46</text><text x="164.0" y="625.0" font-size="10.5" fill="#767676">exp, log only by table search, ≤ 20-bit formats</text><text x="164.0" y="653.0" font-size="11.5" fill="#000000" font-weight="700">on eager device buffers, not in a certified kernel</text><rect x="164.0" y="668.0" width="63.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="195.8" y="682.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">pow #52</text><rect x="234.6" y="668.0" width="90.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="280.0" y="682.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">&lt; ≤ &gt; ≥ #52</text><rect x="332.4" y="668.0" width="84.0" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="374.4" y="682.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">select #52</text><rect x="164.0" y="698.0" width="124.8" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="226.4" y="712.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">table lookup #53</text><text x="562.0" y="509.0" font-size="11.5" fill="#E4002B" font-weight="700">what remote-sensing forward models add</text><rect x="562.0" y="524.0" width="36.4" height="20.0" rx="10.0" fill="#E4002B" stroke="#E4002B" stroke-width="1.2"/><text x="580.2" y="538.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-weight="700">exp</text><rect x="605.4" y="524.0" width="36.4" height="20.0" rx="10.0" fill="#E4002B" stroke="#E4002B" stroke-width="1.2"/><text x="623.6" y="538.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-weight="700">log</text><rect x="648.8" y="524.0" width="43.2" height="20.0" rx="10.0" fill="#E4002B" stroke="#E4002B" stroke-width="1.2"/><text x="670.4" y="538.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-weight="700">sqrt</text><rect x="699.0" y="524.0" width="36.4" height="20.0" rx="10.0" fill="#E4002B" stroke="#E4002B" stroke-width="1.2"/><text x="717.2" y="538.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-weight="700">|x|</text><rect x="742.4" y="524.0" width="36.4" height="20.0" rx="10.0" fill="#E4002B" stroke="#E4002B" stroke-width="1.2"/><text x="760.6" y="538.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-weight="700">min</text><rect x="785.8" y="524.0" width="36.4" height="20.0" rx="10.0" fill="#E4002B" stroke="#E4002B" stroke-width="1.2"/><text x="804.0" y="538.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-weight="700">max</text><rect x="562.0" y="554.0" width="90.8" height="20.0" rx="10.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.2"/><text x="607.4" y="568.0" font-size="11.0" fill="#E4002B" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">table fetch</text><text x="562.0" y="597.0" font-size="10.5" fill="#E4002B">attenuation, dielectric mixing, radiative transfer,</text><text x="562.0" y="612.0" font-size="10.5" fill="#E4002B">calibration tables — in one certified fused kernel</text><text x="164.0" y="759.0" font-size="11.5" fill="#000000" font-weight="700">a tape of operations</text><text x="164.0" y="774.0" font-size="11.5" fill="#000000">forward values and reverse-mode gradients</text><text x="164.0" y="789.0" font-size="11.5" fill="#000000">a node recorded in linear time #51</text><text x="164.0" y="804.0" font-size="11.5" fill="#000000">x ^ y with the exponent a recorded value #54</text><text x="562.0" y="759.0" font-size="11.5" fill="#E4002B" font-weight="700">the model records itself as it runs</text><text x="562.0" y="774.0" font-size="11.5" fill="#E4002B">proved: the recording computes what the model computes</text><text x="562.0" y="789.0" font-size="11.5" fill="#E4002B">repeated steps merged, proved to change no value</text><text x="164.0" y="849.0" font-size="11.5" fill="#000000" font-weight="700">binary32 and binary64 formats, rounding spec</text><text x="164.0" y="864.0" font-size="11.5" fill="#000000">executable binary32 with NaN and infinities</text><text x="164.0" y="879.0" font-size="11.5" fill="#000000">Sterbenz's lemma, absorption test (with FloatLib)</text><text x="562.0" y="849.0" font-size="11.5" fill="#E4002B" font-weight="700">one source, run at every precision</text><text x="562.0" y="864.0" font-size="11.5" fill="#E4002B">binary32 rounding proved against the real numbers,</text><text x="562.0" y="879.0" font-size="11.5" fill="#E4002B">overflow stated; executable ULP for adequacy;</text><text x="562.0" y="894.0" font-size="11.5" fill="#E4002B">Float is the reference run</text><rect x="22.0" y="936.0" width="29.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><text x="36.8" y="950.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">op</text><text x="62.0" y="949.0" font-size="10.5" fill="#767676">TorchLean</text><rect x="140.0" y="936.0" width="29.6" height="20.0" rx="10.0" fill="#FFFFFF" stroke="#E4002B" stroke-width="1.2"/><text x="154.8" y="950.0" font-size="11.0" fill="#000000" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">op</text><text x="180.0" y="949.0" font-size="10.5" fill="#767676">contributed to TorchLean (#n: its pull request)</text><rect x="470.0" y="936.0" width="29.6" height="20.0" rx="10.0" fill="#E4002B" stroke="#E4002B" stroke-width="1.2"/><text x="484.8" y="950.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-weight="700">op</text><text x="510.0" y="949.0" font-size="10.5" fill="#767676">PropertyKindCalculus only</text><rect x="680.0" y="936.0" width="29.6" height="20.0" rx="10.0" fill="#FDECEF" stroke="#E4002B" stroke-width="1.2"/><text x="694.8" y="950.0" font-size="11.0" fill="#E4002B" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">op</text><text x="720.0" y="949.0" font-size="10.5" fill="#767676">both: TorchLean kernel, calculus semantics</text><text x="22.0" y="979.0" font-size="10.5" fill="#767676">Dashed box: no counterpart found in TorchLean's source. Red chips: operations TorchLean's kernel compiler refuses in binary32 and binary64;</text><text x="22.0" y="994.0" font-size="10.5" fill="#767676">its eager device and tape operations include exp, log and sqrt, so the extension is to one certified fused kernel holding a model's whole arithmetic.</text></svg>