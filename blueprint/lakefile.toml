name = "propertykindcalculus-blueprint"
defaultTargets = ["PropertyKindCalculusBlueprint", "blueprint-gen"]

# Verso + the Blueprint genre, on the v4.31.0 toolchain (matching the core
# PropertyKindCalculus library after the v4.31.0 migration). `verso` is pinned to the
# immutable `v4.31.0` *tag*; `verso-blueprint` only ships a *moving* `v4.31.0` branch,
# so it is pinned to that branch's current tip as an exact commit — NOT the branch ref:
# tracking the branch once drifted `verso-blueprint` to a `manualMainWithPreviewData`
# that regressed and killed `blueprint-gen` with exit 137 (SIGKILL). Bump this SHA
# deliberately (re-test `lake exe blueprint-gen`) rather than tracking the branch.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.31.0"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "53a781139092d04ab1babb42f51596b96758da35"

# The library being documented. Linking `(lean := "PropertyKindCalculus.…")` nodes to
# real declarations (and reading their proved/`sorry` status) requires the
# library to be importable here, so we depend on the parent package by path.
[[require]]
name = "PropertyKindCalculus"
path = ".."

[[lean_lib]]
name = "PropertyKindCalculusBlueprint"

[[lean_exe]]
name = "blueprint-gen"
root = "PropertyKindCalculusBlueprintMain"
