name = "propertykindcalculus-blueprint"
defaultTargets = ["PropertyKindCalculusBlueprint", "blueprint-gen"]

# Verso + the Blueprint genre, on the v4.33.0 toolchain — the verso-stack pins move in
# LOCKSTEP (the verso tag, the VersoBlueprint SHA, and the subverso rev verso's own
# manifest names): a mixed stack fails at `VersoLiterate.Basic` against this toolchain's
# core. `verso`'s `v4.33.0` is a `refs/tags` ref and therefore immutable, so naming it is
# already a SHA pin.
#
# `verso-blueprint`'s `v4.33.0` is NOT. It is a `refs/heads` BRANCH — a release line that
# keeps moving — so it must be pinned to an exact commit SHA, and naming the ref instead
# is how this breaks. `lake update` re-resolves a branch to its current tip, which has
# three costs, all seen here: (1) `ci-pages.sh` runs `lake update`, so the manifest is
# rewritten and dirty on every build; (2) the branch once drifted to a
# `manualMainWithPreviewData` that regressed and killed `blueprint-gen` with exit 137;
# and (3) the tip moved onto toolchain **v4.33.1** while verso, TorchLean, Physlib and
# mathlib are all v4.33.0 — which bumps `blueprint/lean-toolchain` out from under mathlib
# and its cache stops resolving (`Dependency Mathlib uses a different lean-toolchain`).
#
# `9dd25554` is the last `v4.33.0`-branch commit that still pins toolchain v4.33.0, which
# is what makes it the pin: the constraint is one Lean version across verso, TorchLean and
# Physlib, and this is the newest verso-blueprint that satisfies it. Bump it deliberately
# — check the candidate's own `lean-toolchain` first, then re-test `lake exe blueprint-gen`
# — rather than tracking the branch.
#
# The siblings do NOT currently agree, and that is worth knowing before assuming a shared
# pin: `soil-moisture-workflows/blueprint` names `c3b8a93c`, and
# `soil-moisture-model/technical-reference` still names the BRANCH `v4.33.0` — so it is one
# `lake update` away from the same break, and fixing it there is a separate edit.
#
# verso `main` carries the fix for the margin-note numbering bug — under `v4.33.0` every
# margin note and its in-text mark renders as "1" (PR #977, commit `a20c785b`) — but that
# commit's own `lean-toolchain` is v4.34.0-rc2, two bumps past this stack, so it fails the
# precheck above and cannot be the pin. The fix is one CSS rule; it is backported as
# `extraCss` in `PropertyKindCalculusBlueprintMain.lean`. Drop that override when this pin
# advances past #977.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.33.0"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "9dd255542ad41ba66492051395c0fd6cacd9f7a9"

# The library being documented. Linking `(lean := "PropertyKindCalculus.…")` nodes to
# real declarations (and reading their proved/`sorry` status) requires the
# library to be importable here, so we depend on the parent package by path.
[[require]]
name = "PropertyKindCalculus"
path = ".."

[[lean_lib]]
name = "PropertyKindCalculusBlueprint"

[[lean_exe]]
name = "blueprint-gen"
root = "PropertyKindCalculusBlueprintMain"
