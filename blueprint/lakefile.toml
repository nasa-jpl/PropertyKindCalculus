name = "propertykindcalculus-blueprint"
defaultTargets = ["PropertyKindCalculusBlueprint", "blueprint-gen"]

# Verso + the Blueprint genre, on the v4.33.0 toolchain — the verso-stack pins move in
# LOCKSTEP (the verso tag, the VersoBlueprint SHA, and the subverso rev verso's own
# manifest names): a mixed stack fails at `VersoLiterate.Basic` against this toolchain's
# core. `verso` is pinned to the immutable `v4.33.0-rc2` *tag*, so its manifest `rev` is
# stable.
#
# `verso-blueprint` only ships a *moving* branch (no tag), so it MUST be pinned to an
# exact commit SHA — NOT the branch ref. Using the branch name has two costs: (1)
# `ci-pages.sh` runs `lake update`, which re-resolves the branch to its current tip on
# every build and rewrites this repo's `lake-manifest.json` (a spurious dirty file each
# time); and (2) tracking the branch once drifted verso-blueprint to a
# `manualMainWithPreviewData` that regressed and killed `blueprint-gen` with exit 137.
# Pinning the SHA fixes both. Bump it deliberately (re-test `lake exe blueprint-gen`)
# rather than tracking the branch; the SHA below is the one the sibling
# `soil-moisture-model` technical reference and `soil-moisture-workflows` blueprint
# build against.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.33.0-rc2"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "c3b8a93c5b97ff26f3ae23c5d0d06411ae416b42"

# The library being documented. Linking `(lean := "PropertyKindCalculus.…")` nodes to
# real declarations (and reading their proved/`sorry` status) requires the
# library to be importable here, so we depend on the parent package by path.
[[require]]
name = "PropertyKindCalculus"
path = ".."

[[lean_lib]]
name = "PropertyKindCalculusBlueprint"

[[lean_exe]]
name = "blueprint-gen"
root = "PropertyKindCalculusBlueprintMain"
