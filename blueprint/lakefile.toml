name = "propertykindcalculus-blueprint"
defaultTargets = ["PropertyKindCalculusBlueprint", "blueprint-gen"]
# Every chapter that cites a definition imports both `VersoBlueprint` and a library module of
# the package it documents, and that package requires the module system. A chapter cannot
# answer by carrying a `module` header of its own: `VersoBlueprint` is a plain file, and a
# `module` file cannot import a non-`module` one. So the mix is declared once here rather
# than left standing as a warning on each chapter, which is what this option is for. It is a
# package-level key, so it belongs above the first `[[…]]` header: below one, TOML reads it
# as a field of THAT table and Lake accepts it in silence.
allowNonModules = true

# Verso + the Blueprint genre, on the v4.34.0 toolchain — the verso-stack pins move in
# LOCKSTEP (the verso rev, the VersoBlueprint SHA, and the subverso rev verso's own
# manifest names): a mixed stack fails at `VersoLiterate.Basic` against this toolchain's
# core. The partner that decides the pair is `verso-blueprint`: its `v4.34.0` line pins
# verso `52c8c955` (`v4.34.0-rc2-3-g52c8c955`, toolchain v4.34.0-rc2) and subverso
# `fda188f7` in its own manifest, and TorchLean upstream renders its docs on that exact
# trio under toolchain v4.34.0. verso's own `v4.34.0` tag (`cad4b633`) is a different
# commit that verso-blueprint does not pin, so it is not the verso pin here.
#
# `verso-blueprint`'s `v4.34.0` is a `refs/heads` BRANCH — a release line that keeps
# moving — so it must be pinned to an exact commit SHA, and naming the ref instead is
# how this breaks. `lake update` re-resolves a branch to its current tip, which has
# three costs: (1) `ci-pages.sh` runs `lake update`, so the manifest is rewritten and
# dirty on every build; (2) a tip can regress `blueprint-gen` (one did, exit 137); and
# (3) a tip can carry a `lean-toolchain` newer than mathlib's, and `lake update` then
# bumps `blueprint/lean-toolchain` out from under mathlib and its cache stops resolving
# (`Dependency Mathlib uses a different lean-toolchain`).
#
# `a48eea9e` is the `v4.34.0`-branch commit TorchLean upstream builds with; the branch tip
# (`19451b00`, PR #460's render-resource refactor) is untested here. Bump it deliberately
# — check the candidate's own `lean-toolchain` and its verso/subverso pins first, then
# re-test `lake exe blueprint-gen` — rather than tracking the branch.
#
# `soil-moisture-model/technical-reference` pins this identical verso + VersoBlueprint
# pair; `soil-moisture-workflows/blueprint` and `L4YAML/doc` pin the stack that matches
# their own toolchain. One toolchain, one Verso stack: a bump here travels with the
# toolchain bump, deliberately.
#
# The margin-note numbering fix (verso PR #977, commit `a20c785b`, in verso's `v4.34.0`
# tag but not in `52c8c955`) is not in this stack — under it every margin note and its
# in-text mark renders as "1". The fix is one CSS rule; it is backported as `extraCss` in
# `PropertyKindCalculusBlueprintMain.lean`. Drop that override when verso-blueprint's
# verso pin advances past #977.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "52c8c9557bcb5cc8c0edc0ee37e74311a3d53ee9"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "a48eea9ecb17d1551fef67d7de90571608663a11"

# The library being documented. Linking `(lean := "PropertyKindCalculus.…")` nodes to
# real declarations (and reading their proved/`sorry` status) requires the
# library to be importable here, so we depend on the parent package by path.
[[require]]
name = "PropertyKindCalculus"
path = ".."

[[lean_lib]]
name = "PropertyKindCalculusBlueprint"

[[lean_exe]]
name = "blueprint-gen"
root = "PropertyKindCalculusBlueprintMain"
